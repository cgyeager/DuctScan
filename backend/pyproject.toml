[project]
name = "refractivity-duct-analyzer-backend"
version = "0.1.0"
description = "FastAPI backend: radiosonde ingestion, modified refractivity, duct detection"
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    # science / data
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "requests>=2.32",
    # LLM / RAG
    "anthropic>=0.60",
    "voyageai>=0.3",
    "supabase>=2.15",
    "tenacity>=9.0",
    "langchain-text-splitters>=0.3",
    # document parsing (pytesseract additionally needs the Tesseract OCR
    # binary installed on the system for the scanned-page fallback)
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query/Depends-in-default idiom is intentional.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]
